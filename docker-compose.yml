services:
  fanuc:
    build: .
    image: fanuc-ros2-jazzy
    container_name: fanuc-ros2
    # Only reachable from your own machine
    ports:
      - "127.0.0.1:6080:6080"
    shm_size: "1gb"
    tty: true
    volumes:
      - ./scripts:/home/dev/scripts      # your own code, editable from VS Code
    # If the build fails on missing arm64 libraries (Apple Silicon), uncomment:
    # platform: linux/amd64